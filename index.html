<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LiveCounts Bulk Generator</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#0f172a;
    color:white;
    padding:20px;
    max-width:1200px;
    margin:auto;
}

h1{
    text-align:center;
}

textarea{
    width:100%;
    height:250px;
    background:#1e293b;
    color:white;
    border:none;
    border-radius:12px;
    padding:12px;
    margin-top:10px;
    resize:vertical;
}

button{
    padding:12px 18px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    margin-top:10px;
    margin-right:5px;
    font-weight:bold;
}

.info{
    margin-top:15px;
    background:#1e293b;
    padding:15px;
    border-radius:12px;
}

</style>
</head>
<body>

<h1>LiveCounts Bulk Generator</h1>

<p>
Вставляй YouTube-ссылки или ID видео, каждый с новой строки.
</p>

<textarea
id="ids"
placeholder="https://www.youtube.com/watch?v=XXXXXXXXXXX"
></textarea>

<br>

<button onclick="generate()">
🔗 Создать ссылки
</button>

<button onclick="copyLinks()">
📋 Скопировать
</button>

<button onclick="downloadTxt()">
💾 Скачать TXT
</button>

<div class="info">
Всего видео: <span id="count">0</span>
</div>

<h3>Результат</h3>

<textarea
id="output"
placeholder="Здесь появятся ссылки"
></textarea>

<script>

function generate(){

    const lines =
        document
        .getElementById("ids")
        .value
        .split("\\n")
        .map(x => x.trim())
        .filter(Boolean);

    const result = [];

    lines.forEach(line => {

        let id = line;

        const match =
            line.match(
                /(?:v=|youtu\\.be\\/)([a-zA-Z0-9_-]{11})/
            );

        if(match){
            id = match[1];
        }

        result.push(
            `https://livecounts.lol/addVideo?id=${id}`
        );

    });

    document.getElementById(
        "output"
    ).value =
        result.join("\\n");

    document.getElementById(
        "count"
    ).textContent =
        result.length;
}

function copyLinks(){

    const output =
        document.getElementById(
            "output"
        );

    output.select();

    document.execCommand(
        "copy"
    );

    alert(
        "Ссылки скопированы"
    );
}

function downloadTxt(){

    const text =
        document.getElementById(
            "output"
        ).value;

    if(!text){
        alert(
            "Сначала создайте ссылки"
        );
        return;
    }

    const blob =
        new Blob(
            [text],
            {
                type:"text/plain"
            }
        );

    const link =
        document.createElement(
            "a"
        );

    link.href =
        URL.createObjectURL(
            blob
        );

    link.download =
        "livecounts_links.txt";

    link.click();
}

</script>

</body>
</html>
